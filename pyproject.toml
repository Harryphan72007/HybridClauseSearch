[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hybridclausesearch"
version = "0.1.0"
description = "Hybrid lexical + dense retrieval over Vietnamese legal clauses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
hcs = "hybridclausesearch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hybridclausesearch"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
